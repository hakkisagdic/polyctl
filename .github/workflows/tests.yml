name: tests
# One test workflow: every push to main and every pull request, on Ubuntu, on the Python 3.9 support floor
# (ubuntu-24.04: GitHub moved ubuntu-latest to Ubuntu 26.04 on 2026-10-21, which has no Python 3.9 build at
# actions/setup-python; the pin moves when that image is retired, CI-UBUNTU-39) and on 3.12 (ubuntu-latest).
# No schedule and no on-demand lanes: macOS and Windows runs are demand-driven, started by hand from a
# branch that adds them, not kept here. Every lane's log ends with each test it skipped and the reason (-rs).

on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -rs

  trailers:
    # Each commit a push lands on main names the grant it was made under and has the tree that grant
    # names (COMMIT-TRAILER). Commits older than the first one carrying the trailers are history from
    # before polyctl wrote them. A ruleset that requires this check is the owner's to set, never polyctl's.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: commit trailers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: every pushed commit has the tree its trailers name
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        # A new branch, or a push that rewrote history, has no before in this history: all of it is read.
        run: |
          range="$BEFORE..$AFTER"
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || range="$AFTER"
          PYTHONPATH=src python -m polyctl commit-check --range "$range" --since-first-trailer
